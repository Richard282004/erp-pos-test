name: Respaldo de la base

# Hace un pg_dump completo de la base de Supabase cada 6 horas y lo guarda
# como artifact del run (descargable desde la pestaña Actions). Cada 6 h en
# vez de 1 vez al día para que, si la base se pierde, no se caigan más de
# ~6 h de ventas.
#
# Requiere el secret DATABASE_URL (Settings -> Secrets and variables -> Actions):
# la conexión Session pooler de Supabase (puerto 5432), no el transaction
# pooler (6543).
#
# Avisa por Telegram en cada corrida (usa los secrets TELEGRAM_BOT_TOKEN /
# TELEGRAM_CHAT_ID, opcionales): "respaldo hecho + estado del backend" si sale
# bien, o "FALLÓ" si no. Son 4 mensajes al día — si molesta, dejá el aviso de
# éxito solo en una de las corridas (ver el `if:` del paso).

on:
  schedule:
    # 02:17 / 08:17 / 14:17 / 20:17 UTC  ≈  22:17 / 04:17 / 10:17 / 16:17 en Chile
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: pg_dump
        env:
          DBURL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DBURL" ]; then
            echo "Falta el secret DATABASE_URL." >&2
            exit 1
          fi
          mkdir -p backup
          nombre="byeburger_$(date -u +%Y%m%d_%H%M)Z.sql.gz"
          # pg_dump 17 desde la imagen oficial, para que coincida con Supabase.
          docker run --rm -e DBURL postgres:17-alpine \
            sh -c 'pg_dump --no-owner --no-privileges --clean --if-exists "$DBURL"' \
            | gzip -9 > "backup/$nombre"
          echo "Generado:"; ls -lh backup/
          # Falla si el dump quedó sospechosamente chico (< 5 KB).
          test "$(stat -c%s "backup/$nombre")" -gt 5120

      - name: Subir respaldo
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          path: backup/*.sql.gz
          # 4 respaldos por día; 35 días de historial alcanza de sobra y no
          # llena la cuota de almacenamiento gratuita de GitHub.
          retention-days: 35
          if-no-files-found: error

      - name: Avisar por Telegram que salió bien
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Sin Telegram configurado, no aviso."
            exit 0
          fi
          tam=$(du -h backup/*.sql.gz | cut -f1)
          # De paso, chequeo que el backend responda.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://byeburger-api.onrender.com/health || echo 000)
          if [ "$code" = "200" ]; then
            estado="backend sin dramas"
          else
            estado="⚠️ backend responde HTTP $code"
          fi
          msg=$(printf '✅ Respaldo de la base hecho (%s) · %s' "$tam" "$estado")
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${msg}" > /dev/null || true

      - name: Avisar por Telegram si falló
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Sin Telegram configurado, no aviso."
            exit 0
          fi
          msg=$(printf '⚠️ POS: el respaldo de la base FALLÓ.\nRevisá: %s' "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${msg}" > /dev/null || true
