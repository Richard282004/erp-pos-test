name: CI

# Lint + tests + build del frontend en cada push y PR. El backend tiene sus
# propios tests (Backend/tests, necesitan Postgres) que por ahora se corren a
# mano: cd Backend && venv/bin/pytest

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
