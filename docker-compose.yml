# Entorno local de desarrollo — TODO en docker, con recarga en vivo.
# Los valores salen de un .env en esta carpeta (copiá .env.example a .env).
#
#   docker compose up            → db + backend + frontend
#   http://localhost:5173        → frontend (vite, recarga al editar)
#   http://localhost:8000        → backend  (uvicorn --reload)
#
# En la nube NO se usa este archivo: frontend → Cloudflare, backend → Render,
# base → Supabase. Ver DEPLOY.md.

services:
  db:
    image: postgres:17
    container_name: burger-pos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burger_pos}
      POSTGRES_USER: ${POSTGRES_USER:-burger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
    ports:
      - "5434:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burger_user} -d ${POSTGRES_DB:-burger_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: burger-pos-backend
    # Migra y levanta con --reload. El código entra por el bind mount de abajo.
    command: sh /app/Backend/start.dev.sh
    # En dev corre como root para no pelear con los permisos del bind mount
    # (la imagen de producción sigue usando el usuario sin privilegios).
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-burger_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-burger_pos}
      JWT_SECRET: ${JWT_SECRET:?definí JWT_SECRET en .env (>= 32 chars aleatorios)}
      JWT_ACCESS_MIN: ${JWT_ACCESS_MIN:-720}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./Backend:/app/Backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: dev
    container_name: burger-pos-frontend
    # `npm ci` al arrancar: deja node_modules EXACTO al package-lock.json (así
    # no vuelve a pasar el "Failed to resolve import"), y no toca el lockfile.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
